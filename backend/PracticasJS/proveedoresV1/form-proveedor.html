<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css">
    <title>Document</title>

    <body>
        
        <div class="container">
        <h1>Formulario de Proveedor</h1>
        <!-- Área para mensajes de feedback (éxito o error) -->
        <div id="mensaje" class="mensaje"></div>
        
        <form id="formProveedor">
            <fieldset>
                <legend>Información del Proveedor</legend>
                
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Proveedor S.A.">
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección:</label>
                    <input type="text" id="direccion" name="direccion" required placeholder="Ej: Calle Falsa 123">
                </div>

                <div class="form-group">
                    <label for="contacto">Contacto:</label>
                    <input type="text" id="contacto" name="contacto" required placeholder="Ej: Juan Pérez">
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="Ej: juan.perez@proveedor.com">
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono1:</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="Ej: +503 20204567">
                </div>

                <div class="form-group">
                    <label for="telefono2">Teléfono2:</label>
                    <input type="tel" id="telefono2" name="telefono2" placeholder="Ej: +503 20204567">
                </div>

                <div class="form-group">
                    <label for="observaciones">Observaciones:</label>
                    <input type="text" id="observaciones" name="observaciones" placeholder="Ej: Comentarios adicionales">
                </div>
        
        </div>    

        <script src="form-proveedor.js"></script>

</head>
<body>
    
</body>
</html>
